name: Bug report
description: クイズアプリの動作不具合や教材内容の誤りを報告します
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何が起きたかを簡潔に書いてください
      placeholder: 例) 特定のクイズセットで採点結果が反映されない
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: どの画面・どのクイズセットで、どの操作をすると起きたか
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する結果
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 環境
      description: OS、ブラウザ、Node.jsバージョンなど
